		<style>
		#etehadyar-studio-in69rh.etehadyar-studio{max-width:720px;margin:0 auto;font-family:inherit;box-sizing:border-box}
		#etehadyar-studio-in69rh *{box-sizing:border-box}
		#etehadyar-studio-in69rh .etehadyar-studio__bar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;margin-bottom:14px;background:#eef6ff;border:1px solid #d7e7fb;border-radius:11px;font-size:.9rem;flex-wrap:wrap}
		#etehadyar-studio-in69rh .etehadyar-studio__topup{font-weight:600;color:#1a5fcc;text-decoration:none}
		#etehadyar-studio-in69rh .etehadyar-studio__tabs{display:flex;gap:6px;margin-bottom:0;flex-wrap:wrap}
		#etehadyar-studio-in69rh .etehadyar-studio__tab{padding:10px 16px;border:1px solid #e3e6ea;border-bottom:none;border-radius:11px 11px 0 0;background:#f7f8fa;font:inherit;font-size:.92rem;cursor:pointer;display:flex;align-items:center;gap:6px}

		#etehadyar-studio-in69rh .etehadyar-studio__panel:not(.is-active){display:none}
		#etehadyar-studio-in69rh .etehadyar-studio__hint{margin:0 0 14px;color:#667085;font-size:.88rem}
		#etehadyar-studio-in69rh .etehadyar-studio__label{display:block;margin-bottom:6px;font-size:.88rem;color:#444}
		#etehadyar-studio-in69rh .etehadyar-studio__input{width:100%;padding:11px 13px;border:1px solid #cfd4da;border-radius:9px;font:inherit;font-size:.96rem;resize:vertical}
		#etehadyar-studio-in69rh .etehadyar-studio__input:focus,#etehadyar-studio-in69rh .etehadyar-studio__number:focus{outline:2px solid #1f6feb;outline-offset:1px;border-color:#1f6feb}

		#etehadyar-studio-in69rh .etehadyar-studio__result img{max-width:100%;height:auto;border-radius:8px}

		<script>
		(function () {
			var root = document.getElementById('etehadyar-studio-in69rh');
			if (!root) { return; }

			var ajaxUrl = root.dataset.ajax,
				restRoot = root.dataset.root,
				nonce = root.dataset.nonce,
				restNonce = root.dataset.restNonce;

			function t(el, sel) { return el.querySelector('[data-slot="' + sel + '"]'); }

			function money(n) {
				return new Intl.NumberFormat('fa-IR').format(Math.round(n)) + ' ریال';
			}

			// Mirrors Estimator::word_count() so the quoted price matches what
			// the server will actually charge.
			function words(s) {
				s = (s || '').replace(/[\u200c\u200d]/g, '');
				var parts = s.split(/[\s\u00a0]+/), n = 0;
				for (var i = 0; i < parts.length; i++) {
					if (/[\p{L}\p{N}]/u.test(parts[i])) { n++; }
				}
				return n;
			}

			function estimate(panel) {
				var op = panel.dataset.operation,
					price = parseInt(panel.dataset.price, 10) || 0,
					prompt = panel.querySelector('[data-field="prompt"]'),
					slot = t(panel, 'estimate'),
					units = 0;

				if (!slot) { return; }

				if (op === 'content_word') {
					var len = panel.querySelector('[data-field="length"]');
					units = (parseInt(len && len.value, 10) || 0) / 100;
				} else if (op === 'voice_minute') {
					units = Math.ceil(((prompt && prompt.value.length) || 0) / 750);
				} else {
					units = 1;
				}

				slot.innerHTML = units > 0 ? money(Math.ceil(units) * price) : '—';
			}

			function setStatus(panel, msg, kind) {
				var s = t(panel, 'status');
				if (!s) { return; }
				s.textContent = msg || '';
				s.className = 'etehadyar-studio__status' + (kind ? ' is-' + kind : '');
			}

			function showResult(panel, data) {
				var box = t(panel, 'result');
				if (!box) { return; }

				box.textContent = '';
				box.hidden = false;

				if (data.url && panel.dataset.operation === 'image') {
					var img = document.createElement('img');
					img.src = data.url;
					img.alt = '';
					box.appendChild(img);
				} else if (data.url && panel.dataset.operation === 'voice_minute') {
					var audio = document.createElement('audio');
					audio.controls = true;
					audio.src = data.url;
					box.appendChild(audio);
				} else if (data.html || data.article) {
					// Server-generated markup is inserted as text first, then
					// parsed, so a malformed provider response cannot inject
					// script into the page.
					var art = document.createElement('div');
					art.innerHTML = (data.html || (data.article && data.article.html) || '')
						.replace(/<script[\s\S]*?<\/script>/gi, '');
					box.appendChild(art);
				} else {
					box.textContent = JSON.stringify(data, null, 2);
				}
			}

			function refreshBalance() {
				fetch(restRoot + '/wallet', { headers: { 'X-WP-Nonce': restNonce }, credentials: 'same-origin' })
					.then(function (r) { return r.ok ? r.json() : null; })
					.then(function (d) {
						var slot = t(root, 'balance');
						if (d && slot && typeof d.balance !== 'undefined') {
							slot.innerHTML = money(d.balance);
						}
					})
					.catch(function () {});
			}

			function poll(panel, jobId, tries) {
				if (tries <= 0) {
					setStatus(panel, 'کار هنوز در صف است. نتیجه در پنل کاربری نمایش داده می‌شود.', '');
					return;
				}

				fetch(restRoot + '/studio/job/' + jobId, {
					headers: { 'X-WP-Nonce': restNonce },
					credentials: 'same-origin'
				})
					.then(function (r) { return r.json(); })
					.then(function (job) {
						if (!job || !job.status) { throw new Error('bad'); }

						if (!job.is_final) {
							setStatus(panel, 'در حال پردازش…', '');
							setTimeout(function () { poll(panel, jobId, tries - 1); }, 3000);
							return;
						}

						if (job.status === 'completed') {
							setStatus(panel, 'انجام شد.', 'ok');
							showResult(panel, job.result || {});
						} else {
							setStatus(panel, job.error || 'کار ناموفق بود؛ مبلغ بازگردانده می‌شود.', 'error');
						}
						refreshBalance();
					})
					.catch(function () {
						setStatus(panel, 'خطا در دریافت وضعیت کار.', 'error');
					});
			}

			function run(panel) {
				var btn = panel.querySelector('[data-action="run"]'),
					prompt = panel.querySelector('[data-field="prompt"]'),
					value = (prompt && prompt.value || '').trim();

				if (!value) {
					setStatus(panel, 'لطفاً ابتدا متن را وارد کنید.', 'error');
					return;
				}

				var body = new FormData();
				body.append('action', panel.dataset.action);
				body.append('_ajax_nonce', nonce);

				if (panel.dataset.operation === 'voice_minute') {
					body.append('text', value);
				} else {
					body.append('prompt', value);
				}

				var len = panel.querySelector('[data-field="length"]');
				if (len) { body.append('length', len.value); }

				btn.disabled = true;
				setStatus(panel, 'در حال اجرا… این کار ممکن است تا یک دقیقه طول بکشد.', '');
				var box = t(panel, 'result');
				if (box) { box.hidden = true; }

				fetch(ajaxUrl, { method: 'POST', body: body, credentials: 'same-origin' })
					.then(function (r) { return r.json().catch(function () { return null; }); })
					.then(function (res) {
						btn.disabled = false;

						if (!res) {
							setStatus(panel, 'پاسخ نامعتبر بود؛ در صورت کسر، مبلغ بازگردانده می‌شود.', 'error');
							refreshBalance();
							return;
						}

						if (!res.success) {
							var d = res.data;
							setStatus(panel, (d && (d.message || d)) || 'عملیات ناموفق بود.', 'error');
							refreshBalance();
							return;
						}

						var data = res.data || {};

						if (data.queued && data.job_id) {
							setStatus(panel, 'کار در صف قرار گرفت…', '');
							poll(panel, data.job_id, 40);
							return;
						}

						setStatus(panel, 'انجام شد.', 'ok');
						showResult(panel, data);
						refreshBalance();
					})
					.catch(function () {
						btn.disabled = false;
						setStatus(panel, 'ارتباط با سرور برقرار نشد.', 'error');
					});
			}

			root.addEventListener('click', function (e) {
				var tab = e.target.closest('.etehadyar-studio__tab');
				if (tab) {
					var key = tab.dataset.tab;
					root.querySelectorAll('.etehadyar-studio__tab').forEach(function (b) {
						var on = b === tab;
						b.classList.toggle('is-active', on);
						b.setAttribute('aria-selected', on ? 'true' : 'false');
					});
					root.querySelectorAll('.etehadyar-studio__panel').forEach(function (p) {
						var on = p.dataset.panel === key;
						p.classList.toggle('is-active', on);
						p.hidden = !on;
					});
					return;
				}

				var runBtn = e.target.closest('[data-action="run"]');
				if (runBtn) {
					run(runBtn.closest('.etehadyar-studio__panel'));
				}
			});

			root.addEventListener('input', function (e) {
				var panel = e.target.closest('.etehadyar-studio__panel');
				if (panel) { estimate(panel); }
			});

			root.querySelectorAll('.etehadyar-studio__panel').forEach(estimate);
		}());
		</script>
		</body></html>
